name: Build SukiSU-Ultra Kernel for Xiaomi Pad 7 Pro (muyu)

env:
  kernel_repository: MiCode/Xiaomi_Kernel_OpenSource
  kernel_branch: muyu-v-oss
  device: muyu
  device_name: Xiaomi Pad 7 Pro
  android_version: Android U
  base_defconfig: gki_defconfig
  device_configs: |
    arch/arm64/configs/vendor/pineapple_GKI.config
    arch/arm64/configs/vendor/muyu_GKI.config

on:
  workflow_dispatch:
    inputs:
      sukisu_tag:
        description: "SukiSU-Ultra tag/branch (default: main)"
        required: false
        default: "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      sukisu_ref: ${{ inputs.sukisu_tag || 'main' }}
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pkg-config \
            python3 \
            zip \
            zlib1g-dev

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.device }}-${{ env.kernel_branch }}-clang-r547379
          restore-keys: |
            ccache-${{ env.device }}-${{ env.kernel_branch }}-
            ccache-${{ env.device }}-

      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-kei-r547379

      - name: Clone Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$HOME/clang"
          git clone --depth=1 https://gitlab.com/kei-space/clang/r547379 "$HOME/clang"

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}

      - name: Setup SukiSU-Ultra
        run: |
          set -euo pipefail
          case "${sukisu_ref}" in
            *[!A-Za-z0-9._/-]*|'')
              echo "Invalid sukisu_ref: ${sukisu_ref}" >&2
              exit 1
              ;;
          esac
          rm -rf /tmp/SukiSU-Ultra
          git init /tmp/SukiSU-Ultra
          git -C /tmp/SukiSU-Ultra remote add origin https://github.com/SukiSU-Ultra/SukiSU-Ultra
          git -C /tmp/SukiSU-Ultra fetch --depth=1 origin "${sukisu_ref}"
          git -C /tmp/SukiSU-Ultra checkout --detach FETCH_HEAD
          sukisu_commit="$(git -C /tmp/SukiSU-Ultra rev-parse HEAD)"
          bash /tmp/SukiSU-Ultra/kernel/setup.sh "${sukisu_commit}"

      - name: Configure kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KCONFIG_CONFIG=out/.config

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.base_defconfig }}

          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            ${{ env.device_configs }}

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          ./scripts/config --file out/.config \
            -e KSU \
            -e KPM \
            -d WERROR

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          # Verify the workflow-applied options plus one anchor key from each required target fragment.
          grep -qxF 'CONFIG_KSU=y' out/.config
          grep -qxF 'CONFIG_KPM=y' out/.config
          grep -qxF 'CONFIG_ARCH_PINEAPPLE=y' out/.config
          grep -qxF 'CONFIG_MI_HARDWARE_ID=m' out/.config

      - name: Build kernel
        run: |
          set -euo pipefail
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=localhost
          export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-muyu-kernel
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
          retention-days: 30
