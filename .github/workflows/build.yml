name: Build SukiSU-Ultra Kernel for Xiaomi Pad 7 Pro (muyu)

env:
  kernel_repository: MiCode/Xiaomi_Kernel_OpenSource
  kernel_branch: muyu-v-oss
  device: muyu
  device_name: Xiaomi Pad 7 Pro
  android_version: Android U
  anykernel3_ref: 020dfeccf9d7e962a48400fc94d3e451df92eead
  base_defconfig: gki_defconfig
  device_configs: |
    arch/arm64/configs/vendor/pineapple_GKI.config
    arch/arm64/configs/vendor/muyu_GKI.config

on:
  workflow_dispatch:
    inputs:
      sukisu_tag:
        description: "SukiSU-Ultra tag/branch/commit (default: main)"
        required: false
        default: "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      sukisu_ref: ${{ inputs.sukisu_tag || 'main' }}
    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pkg-config \
            python3 \
            zip \
            zlib1g-dev

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.device }}-${{ env.kernel_branch }}-${{ env.anykernel3_ref }}-${{ inputs.sukisu_tag || 'main' }}
          restore-keys: |
            ccache-${{ env.device }}-${{ env.kernel_branch }}-
            ccache-${{ env.device }}-

      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-kei-r547379

      - name: Clone Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$HOME/clang"
          git clone --depth=1 https://gitlab.com/kei-space/clang/r547379 "$HOME/clang"

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}

      - name: Get kernel commit info
        id: kernel-info
        run: |
          echo "kernel_commit_id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$(make kernelversion 2>/dev/null || echo '6.1.68')" >> "$GITHUB_OUTPUT"

      - name: Setup SukiSU-Ultra
        run: |
          set -euo pipefail
          rm -rf /tmp/SukiSU-Ultra
          git init /tmp/SukiSU-Ultra
          git -C /tmp/SukiSU-Ultra remote add origin https://github.com/SukiSU-Ultra/SukiSU-Ultra
          git -C /tmp/SukiSU-Ultra fetch --depth=1 origin "${sukisu_ref}"
          git -C /tmp/SukiSU-Ultra checkout --detach FETCH_HEAD
          bash /tmp/SukiSU-Ultra/kernel/setup.sh "${sukisu_ref}"

      - name: Configure kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.base_defconfig }}

          ./scripts/kconfig/merge_config.sh -m -O out \
            out/.config \
            ${{ env.device_configs }}

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          grep -qxF 'CONFIG_KSU=y' out/.config
          grep -qxF 'CONFIG_KPM=y' out/.config
          grep -qxF 'CONFIG_ARCH_PINEAPPLE=y' out/.config
          grep -qxF 'CONFIG_MI_PEN_WIRELESS=y' out/.config

          ./scripts/config --file out/.config \
            -e KSU \
            -e KPM \
            -d WERROR

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Build kernel
        run: |
          set -euo pipefail
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=localhost
          export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          ref: ${{ env.anykernel3_ref }}
          path: AnyKernel3

      - name: Pack with AnyKernel3
        run: |
          set -euo pipefail

          cat > AnyKernel3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## Generated by GitHub Actions

          ### AnyKernel setup
          properties() { '
          kernel.string=SukiSU-Ultra ($sukisu_ref) for $device_name ($device)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=$device
          device.name2=xiaomi-muyu
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          cp out/arch/arm64/boot/Image AnyKernel3/
          if [ -f out/arch/arm64/boot/Image.lz4 ]; then
            cp out/arch/arm64/boot/Image.lz4 AnyKernel3/
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          cd AnyKernel3
          rm -rf .git* README.md
          zip -r ../boot.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-muyu-boot
          path: |
            boot.zip
            build.log
            out/.config
            out/arch/arm64/boot/Image
          retention-days: 30
