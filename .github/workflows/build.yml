name: Build SukiSU-Ultra Kernel for Xiaomi Pad 7 Pro (muyu)

env:
  kernel_repository: MiCode/Xiaomi_Kernel_OpenSource
  kernel_branch: muyu-v-oss
  device: muyu
  device_name: Xiaomi Pad 7 Pro
  android_version: Android U
  defconfig: |
    gki_defconfig
    vendor/pineapple_GKI.config
    vendor/muyu_GKI.config

on:
  workflow_dispatch:
    inputs:
      sukisu_tag:
        description: "SukiSU-Ultra tag/branch/commit (default: main)"
        required: false
        default: "main"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Set env
        run: |
          SUKISU_REF="${{ inputs.sukisu_tag || 'main' }}"
          echo "sukisu_ref=$SUKISU_REF" >> "$GITHUB_ENV"

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            dwarves \
            flex \
            git \
            kmod \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pkg-config \
            python3 \
            unzip \
            zip \
            zlib1g-dev

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.device }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.device }}-

      - name: Cache Clang toolchain
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: clang-kei-r547379

      - name: Clone Clang toolchain
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf "$HOME/clang"
          git clone --depth=1 https://gitlab.com/kei-space/clang/r547379 "$HOME/clang"

      - name: Add Clang to PATH
        run: echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.kernel_repository }}
          ref: ${{ env.kernel_branch }}

      - name: Get kernel commit info
        run: |
          echo "kernel_commit_id=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "kernel_version=$(make kernelversion 2>/dev/null || echo '6.1.68')" >> "$GITHUB_ENV"

      - name: Setup SukiSU-Ultra
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ env.sukisu_ref }}/kernel/setup.sh" | bash -s "${{ env.sukisu_ref }}"

      - name: Configure kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.defconfig }}

          ./scripts/config --file out/.config \
            -e KSU \
            -e KPM \
            -d WERROR

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Build kernel
        run: |
          set -euo pipefail
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/clang/bin:$PATH"
          export KBUILD_BUILD_USER=build
          export KBUILD_BUILD_HOST=localhost
          export KBUILD_COMPILER_STRING="$(clang --version | head -n1)"

          make -j"$(nproc --all)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image

      - name: Pack with AnyKernel3
        run: |
          set -euo pipefail
          curl -Lo AnyKernel3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q AnyKernel3.zip

          cat > AnyKernel3-master/anykernel.sh <<EOF
          properties() { '
          kernel.string=SukiSU-Ultra (${{ env.sukisu_ref }}) for ${{ env.device_name }} (${{ env.device }})
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=1
          device.name1=${{ env.device }}
          device.name2=muyu
          device.name3=Xiaomi_Pad_7_Pro
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF

          cp out/arch/arm64/boot/Image AnyKernel3-master/
          if [ -f out/arch/arm64/boot/Image.lz4 ]; then
            cp out/arch/arm64/boot/Image.lz4 AnyKernel3-master/
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3-master/
          fi

          cd AnyKernel3-master
          rm -rf .git* README.md
          zip -r ../boot.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-muyu-boot
          path: |
            boot.zip
            build.log
            out/.config
            out/arch/arm64/boot/Image
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sukisu-${{ env.sukisu_ref }}-${{ env.device }}-${{ env.kernel_commit_id }}
          body: |
            ## SukiSU-Ultra Kernel for ${{ env.device_name }} (${{ env.device }})

            **Device:** ${{ env.device_name }} (${{ env.device }})
            **Android:** ${{ env.android_version }}
            **Kernel:** ${{ env.kernel_version }} (${{ env.kernel_commit_id }})
            **SukiSU-Ultra:** ${{ env.sukisu_ref }}

            ### Kernel Source
            https://github.com/${{ env.kernel_repository }}/tree/${{ env.kernel_branch }}

            ### SukiSU-Ultra
            https://github.com/SukiSU-Ultra/SukiSU-Ultra

            ### Installation
            1. Download `boot.zip`
            2. Flash it from a custom recovery that supports the device
            3. Reboot the tablet
            4. Install the SukiSU-Ultra manager APK from the upstream releases page

            > ⚠️ Flash at your own risk. Keep a backup of your stock boot image before flashing.
          files: |
            boot.zip
